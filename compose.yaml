name: maintenance-training-base
services:
  app:
    build: .
    image: maintenance-training-php:local
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8611:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  reports-worker:
    user: "www-data"
    image: maintenance-training-php:local
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=reports", "--sleep=2", "--tries=2", "--timeout=210", "--max-time=3600", "--memory=384"]
    stop_grace_period: 240s
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
  reports-scheduler:
    user: "www-data"
    image: maintenance-training-php:local
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-maintenance_training}
      MARIADB_USER: ${DB_USERNAME:-maintenance}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3611:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
    ports:
      - "127.0.0.1:8610:80"
    depends_on:
      mariadb:
        condition: service_healthy
volumes:
  vendor:
  database:
